{% extends "base.html" %}
{% block title %}Create Account – TripEasy{% endblock %}

{% block content %}
<form class="panel login-box" method="post">
  <h2>Create your account</h2>
  <p class="muted">We will use these details to fill your bookings automatically.</p>
  <input type="hidden" name="next" value="{{ next }}">
  <div class="row"><input name="name" placeholder="Full name" required></div>
  <div class="row">
    <input name="age" type="number" placeholder="Age" min="0" max="120" required>
    <select name="gender" required>
      <option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option>
    </select>
  </div>
  <div class="row"><input name="email" type="email" placeholder="Email" required></div>
  <div class="row"><input name="phone" placeholder="10-digit mobile number" required></div>
  <div class="row"><input name="password" type="password" placeholder="Password (min 8 characters)" required></div>
  <button class="btn" type="submit">CREATE ACCOUNT</button>
  <p>Already have an account? <a href="{{ url_for('login', next=next) }}">Log in</a></p>
</form>
{% endblock %}
